name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      LC_ALL: en_US.UTF-8
      TZ: UTC
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check contributor environment
        run: bash scripts/doctor.sh
      - name: Check Swift formatting
        run: swift format lint --strict --recursive Sources Tests Tools Package.swift
      - name: Run headless tests and synthetic native renders
        run: |
          mkdir -p .build/menubar-validation
          MENUBAR_PREVIEW_PATH="$PWD/.build/menubar-validation/panel.png" \
          MENUBAR_ICON_PREVIEW_PATH="$PWD/.build/menubar-validation/icons.png" \
          MENUBAR_MESSAGE_PREVIEW_PATH="$PWD/.build/menubar-validation/message.png" \
          swift test
      - name: Retain synthetic native renders
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: menubar-validation
          path: .build/menubar-validation/*.png
          if-no-files-found: warn
          include-hidden-files: true
      - name: Build and verify menu bar app
        run: |
          bash scripts/menubar.sh build
          plutil -lint '.build/Agent Monitor.app/Contents/Info.plist'
          codesign --verify --deep --strict '.build/Agent Monitor.app'
      - name: Check README preview
        run: bash scripts/preview.sh check
      - name: Test optional skill installer without network access
        run: bash scripts/test-skills.sh
